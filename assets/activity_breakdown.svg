    <text x="242.3" y="44.4" text-anchor="middle" class="text-val" style="">141</text>
    <rect x="225.3" y="32" width="34" height="80" rx="4" class="track" />
    <rect x="225.3" y="50.4" width="34" height="61.6" rx="4" class="bar-normal" />
    <text x="242.3" y="130" text-anchor="middle" class="text-day">Fri</text>
    <text x="298.7" y="69.7" text-anchor="middle" class="text-val" style="">83</text>
    <rect x="281.7" y="32" width="34" height="80" rx="4" class="track" />
    <rect x="281.7" y="75.7" width="34" height="36.3" rx="4" class="bar-normal" />
    <text x="298.7" y="130" text-anchor="middle" class="text-day">Sat</text>
    <text x="355.0" y="59.2" text-anchor="middle" class="text-val" style="">107</text>
    <rect x="338.0" y="32" width="34" height="80" rx="4" class="track" />
    <rect x="338.0" y="65.2" width="34" height="46.8" rx="4" class="bar-normal" />
    <text x="355.0" y="130" text-anchor="middle" class="text-day">Sun</text>
  </g>
