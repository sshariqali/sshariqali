    <text x="17.0" y="43.9" text-anchor="middle" class="text-val" style="">142</text>
    <rect x="0.0" y="32" width="34" height="80" rx="4" class="track" />
    <rect x="0.0" y="49.9" width="34" height="62.1" rx="4" class="bar-normal" />
