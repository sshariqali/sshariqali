    <text x="0" y="25" class="text-label">Morning</text>
    <rect x="110" y="16" width="175" height="10" rx="5" class="track" />
    <rect x="110" y="16" width="11.5" height="10" rx="5" class="bar-normal" />
    <text x="299" y="25" class="text-val">58 <tspan class="text-val-muted">(6.5%)</tspan></text>
    <text x="0" y="57" class="text-label">Afternoon</text>
    <rect x="110" y="48" width="175" height="10" rx="5" class="track" />
    <rect x="110" y="48" width="66.4" height="10" rx="5" class="bar-peak" />
    <text x="299" y="57" class="text-val">336 <tspan class="text-val-muted">(37.9%)</tspan></text>
    <text x="0" y="89" class="text-label">Evening</text>
    <rect x="110" y="80" width="175" height="10" rx="5" class="track" />
    <rect x="110" y="80" width="53.3" height="10" rx="5" class="bar-normal" />
    <text x="299" y="89" class="text-val">270 <tspan class="text-val-muted">(30.5%)</tspan></text>
    <text x="0" y="121" class="text-label">Night</text>
    <rect x="110" y="112" width="175" height="10" rx="5" class="track" />
    <rect x="110" y="112" width="43.8" height="10" rx="5" class="bar-normal" />
    <text x="299" y="121" class="text-val">222 <tspan class="text-val-muted">(25.1%)</tspan></text>
  </g>
  <line x1="420" y1="68" x2="420" y2="208" class="divider" stroke-width="1" />
