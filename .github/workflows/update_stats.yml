name: Update Activity Breakdown Stats

on:
  schedule:
    - cron: '0 0 * * *' # Daily at 00:00 UTC (05:00 PKT)
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Stats Generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_stats.py

      - name: Commit & Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/activity_breakdown.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update activity stats charts [skip ci]" && git push)
